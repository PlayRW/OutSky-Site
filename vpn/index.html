<!DOCTYPE html>
<html lang="ru" data-to="https://outsky.cc/">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OutSky VPN — VPN-сервис от команды OutSky</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'">
<!-- OutSky VPN переехал на outsky.cc: away.js уводит на адрес из data-to вместе с #якорем.
     meta refresh — запасной путь без JS; он в <noscript>, иначе в Safari/WebKit он перебивает location.replace и теряет #якорь. -->
<script src="/assets/js/away.js"></script>
<noscript><meta http-equiv="refresh" content="0; url=https://outsky.cc/"></noscript>
<link rel="canonical" href="https://outsky.cc/">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0d0b20">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icon.png" type="image/png">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/vpn.css">
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main class="moved">
  <div class="box glass">
    <h1>OutSky VPN</h1>
    <p>Новый адрес: <a href="https://outsky.cc/">outsky.cc</a></p>
  </div>
</main>
</body>
</html>
